---
# Local composite action shared by the deploy workflow's two jobs, so the
# "check" and "apply" jobs are guaranteed to run with identical tooling.
# Composite actions can't read secrets directly; the caller passes them in.
name: Ansible runner setup
description: Install pinned Ansible, join the tailnet, and configure SSH to the Pi

inputs:
  ts-oauth-client-id:
    description: Tailscale OAuth client ID (tag:ci, auth_keys scope)
    required: true
  ts-oauth-secret:
    description: Tailscale OAuth client secret
    required: true
  pi-host:
    description: Pi's Tailscale IP or MagicDNS name
    required: true
  ssh-private-key:
    description: Deploy SSH private key authorized on the Pi
    required: true
  ssh-known-hosts:
    description: known_hosts line(s) for pi-host (pins the Pi's host key)
    required: true

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements-dev.txt

    - name: Install Ansible and collections
      shell: bash
      run: |
        pip install -r requirements-dev.txt
        ansible-galaxy collection install -r ansible/requirements.yml

    # Joins this runner to the tailnet as an EPHEMERAL node tagged tag:ci.
    # It disappears from the tailnet automatically when the job ends. The
    # Tailscale client version is pinned by the action's own commit.
    - name: Connect to Tailscale
      uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd  # v4.2.0
      with:
        oauth-client-id: ${{ inputs.ts-oauth-client-id }}
        oauth-secret: ${{ inputs.ts-oauth-secret }}
        tags: tag:ci
        ping: ${{ inputs.pi-host }}

    # The host key is pinned from a secret instead of disabling
    # StrictHostKeyChecking. If the Pi is reimaged its host key changes and
    # this fails loudly -- update PI_SSH_KNOWN_HOSTS after verifying.
    - name: Configure SSH
      shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh-private-key }}
        KNOWN_HOSTS: ${{ inputs.ssh-known-hosts }}
      run: |
        install -d -m 700 ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
        chmod 600 ~/.ssh/id_deploy
        printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 644 ~/.ssh/known_hosts
