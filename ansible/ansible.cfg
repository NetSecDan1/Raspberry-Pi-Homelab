# Ansible reads this file automatically when you run commands from ansible/.
# (It is ignored if the directory is world-writable -- a security feature.)
[defaults]
inventory = inventory.ini
roles_path = roles
# Never auto-accept an unknown SSH host key. First contact: ssh to the Pi
# manually once and verify the fingerprint, which writes ~/.ssh/known_hosts.
host_key_checking = True
# Human-readable task output instead of one-line JSON blobs.
callback_result_format = yaml
# Don't leave *.retry files lying around after a failed run.
retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
# Reuse one SSH connection for many tasks; makes runs several times faster.
pipelining = True
