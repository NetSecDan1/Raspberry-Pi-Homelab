---
# Ansible collections this repo depends on, pinned to exact versions so a
# run next year behaves like a run today. Bump deliberately, in a PR.
#   ansible-galaxy collection install -r ansible/requirements.yml
collections:
  - name: ansible.posix       # sysctl
    version: "2.2.2"
  - name: community.docker    # docker_compose_v2
    version: "5.3.0"
