# Single-host inventory.
#
# ansible_host is the Pi's LAN IP. That is what the FIRST run (bootstrap,
# from your workstation on the home LAN) must use, because Tailscale isn't
# installed yet. CI overrides it with the Pi's Tailscale address at runtime
# (see .github/workflows/deploy.yml), so nothing here needs editing for CI.
#
# EDIT: ansible_host and ansible_user to match your Pi.
[gateway]
pi-gateway ansible_host=192.168.1.2 ansible_user=pi
