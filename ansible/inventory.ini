# Single-host inventory. No real address is committed (public repo):
# ansible_host comes from the PI_HOST environment variable at run time.
#
#   Local first run (Tailscale not installed yet): export PI_HOST=<Pi's LAN IP>
#   Later / CI:                                    PI_HOST=<Pi's Tailscale IP>
#
# EDIT: ansible_user if your login user isn't "pi".
[gateway]
pi-gateway ansible_host="{{ lookup('ansible.builtin.env', 'PI_HOST') }}" ansible_user=pi
