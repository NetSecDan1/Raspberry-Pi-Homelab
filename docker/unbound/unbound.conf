# Pi gateway overrides for Unbound.
#
# Mounted into the klutchell/unbound image as custom.conf.d/pi-gateway.conf
# and loaded AFTER the image's defaults, so settings here win. The defaults
# already cover: listen on 0.0.0.0:53, access-control for RFC1918 ranges
# (which includes the Docker bridge Pi-hole connects from), DNS-rebinding
# protection (private-address), prefetch, serve-expired, root hints and
# DNSSEC trust anchor. We only add what's specific to this Pi.
#
# Reference: https://unbound.docs.nlnetlabs.nl/en/latest/manpages/unbound.conf.html

server:
    # Docker's default bridge has no IPv6. Without this Unbound keeps trying
    # IPv6 root/authoritative servers, timing out, and every cold lookup is
    # slow. Clients can still get AAAA records; this only affects how
    # Unbound itself talks upstream.
    do-ip6: no

    # Don't reveal software/version to anyone who asks (id.server, version.bind).
    hide-identity: yes
    hide-version: yes

    # Send upstream servers only as much of the name as they need.
    qname-minimisation: yes
    # Use DNSSEC-signed NSEC records to answer NXDOMAIN from cache.
    aggressive-nsec: yes
    harden-below-nxdomain: yes

    # Pi 4 with 4-8 GB RAM: the image defaults (64m/128m) are fine; one
    # thread is plenty for a household.
    num-threads: 1
